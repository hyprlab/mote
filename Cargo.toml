[package]
name = "mote"
version = "1.5.0"
edition = "2024"
description = "A GNOME-native remote desktop client for Linux machines running RDP"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hyprlab/mote"
rust-version = "1.94"

[features]
# The beta app, which the Flatpak and the AppImage of a beta version are:
# "Mote (beta)", app ID co.hyprlab.Mote.Beta, its own launcher and icon, so it
# runs beside the stable app. It shares the stable app's connections, settings
# and passwords.
beta = []

[dependencies]
# The GNOME 50 runtime ships GTK 4.20 and libadwaita 1.9; these floors stay at
# or below that so a Flatpak build and a host build use the same API, and
# at what Debian 13 has, the oldest release the .deb is built on. v1_7
# brings AdwToggleGroup and AdwWrapBox.
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
relm4 = { version = "0.11", features = ["macros", "libadwaita"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
tracing = "0.1"
# Profiles and settings are TOML in the user's config directory.
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The RDP engine. The `ironrdp` umbrella crate lags its parts (it pins an
# older connector), so the parts are named one by one, all from one release.
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-tokio = "0.12"
ironrdp-tls = { version = "0.3", features = ["rustls-ring"] }
ironrdp-input = "0.9"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-core = "0.3"
ironrdp-dvc = "0.10"
# Display Control, which resizes the remote desktop with the window.
ironrdp-displaycontrol = "0.10"
# The Graphics Pipeline, which GNOME Remote Desktop requires.
ironrdp-egfx = "0.5"
# The shared clipboard.
ironrdp-cliprdr = "0.9"
# Sound from the server, and the microphone to it.
ironrdp-rdpsnd = "0.11"
ironrdp-rdpeai = "0.2"
# Static channels, which Mote wraps the sound channel's in.
ironrdp-svc = "0.10"
# A shared folder, served by IronRDP's backend for Unix, and the calls
# Mote's corrections to it make on the folder.
ironrdp-rdpdr = "0.9"
ironrdp-rdpdr-native = "0.9"
# (`net`: the network interfaces, which the scan for servers starts from.)
nix = { version = "0.31", features = ["fs", "net"] }
# The ways to a server other than straight there: an RD Gateway, through
# IronRDP's client for it, and an SSH tunnel, through russh on ring, the
# crypto rustls already uses. The gateway's NTLM brings aws-lc along, so
# rustls has two providers and is told to use ring (see `rdp::start`).
ironrdp-mstsgu = "0.1"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
# Keepalive and a send timeout on the connection, so a dropped network is
# noticed in seconds rather than the minutes TCP takes.
socket2 = { version = "0.6", features = ["all"] }
# H.264 through the system's OpenH264, loaded at run time: no C++ to build,
# and Cisco's patent license stays with Cisco's library.
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
# FFmpeg's decoder, loaded at run time the same way: what the Flatpak has.
libloading = "0.8"
# Fetching Cisco's OpenH264 on request, and unpacking it.
ureq = "3"
bzip2 = "0.6"
# Each session runs on its own thread, on a single-threaded runtime.
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
# Its errors, to tell an old TLS version from other handshake failures, and
# its choice of crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The server certificate's DER, for its fingerprint.
x509-cert = "0.3"
# Passwords are wiped from memory once dropped.
zeroize = "1"
# VNC: DES for VNC Authentication, zlib for the ZRLE, Zlib and Tight
# encodings, and JPEG for Tight's pictures. All pure Rust.
des = "0.9"
flate2 = "1"
zune-jpeg = "0.5"
zune-core = "0.5"
# VNC's own encryption: RSA-AES (RSA, AES in EAX mode, SHA-1 and SHA-256),
# Apple's Diffie-Hellman (MD5 and AES), and Apple's SRP (SHA-512 and PBKDF2,
# then AES and SHA-1). RustCrypto, pure Rust.
rsa = "0.9"
aes = "0.8"
eax = "0.5"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# GNOME's Secret Service client: the keyring on the host, the secret portal
# inside Flatpak. Async on tokio, the runtime relm4's commands already run.
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Keychain, where macOS keeps passwords.
security-framework = "3"
# AppKit and Foundation, for the language macOS is set to and for Sparkle,
# which updates the app.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSEnumerator", "NSLocale", "NSString"] }
# CoreFoundation's types, for the attributes VideoToolbox decodes H.264 to.
core-foundation = "0.10"

[build-dependencies]
glib-build-tools = "0.22"

[profile.dev]
# The session decodes video frames; an unoptimised build is too slow to judge
# by eye, and opt-level 1 keeps the edit-build loop short.
opt-level = 1

# The decoders, though, run at full speed even in a debug build: a session
# at 4K is too slow to use otherwise.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
